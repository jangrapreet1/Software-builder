version: '3.8'

services:
  # FastAPI Backend/Coordinator
  coordinator:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile
    container_name: sb-coordinator
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=${DATABASE_URL}
      - GENERATED_APPS_DIR=/app/generated
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ../generated:/app/generated
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.sb_artifacts:/app/.sb_artifacts
    networks:
      - sb-network
    # Memory limits for 1GB RAM instance
    mem_limit: 512m
    memswap_limit: 1g
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (Production Build)
  frontend:
    build:
      context: ../coordinator/ui
      dockerfile: Dockerfile.prod
    container_name: sb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - sb-network
    mem_limit: 256m
    depends_on:
      - coordinator

networks:
  sb-network:
    driver: bridge

# Note: PostgreSQL runs on separate instance
# Database connection via DATABASE_URL environment variable
