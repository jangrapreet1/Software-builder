version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softwarebuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-appbuilder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softwarebuilder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend/Coordinator
  coordinator:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile
    container_name: sb-coordinator
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-softwarebuilder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-appbuilder}
      - GENERATED_APPS_DIR=/app/generated
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ../generated:/app/generated
      - /var/run/docker.sock:/var/run/docker.sock  # Required for sandbox orchestration
      - ../.sb_artifacts:/app/.sb_artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (Production Build)
  frontend:
    build:
      context: ../coordinator/ui
      dockerfile: Dockerfile.prod
    container_name: sb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - sb-network
    depends_on:
      - coordinator

networks:
  sb-network:
    driver: bridge

volumes:
  postgres_data:
