version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: appbuilder-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appbuilder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appbuilder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: appbuilder-coordinator
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/appbuilder
      - GENERATED_APPS_DIR=/app/generated
    ports:
      - "${COORDINATOR_PORT:-5000}:5000"
    volumes:
      - ./coordinator:/app
      - ./generated:/app/generated
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appbuilder-network
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

networks:
  appbuilder-network:
    driver: bridge

volumes:
  postgres_data:
