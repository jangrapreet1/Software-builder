name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code format check (black, isort)
        run: |
          black --version
          isort --version
          black --check .
          isort --check-only .

      - name: Type check (mypy)
        continue-on-error: true
        run: |
          mypy --version
          mypy .

      - name: Security scan (bandit)
        continue-on-error: true
        run: |
          bandit -r . -q

      - name: Environment for tests
        run: |
          echo "GOOGLE_API_KEY=dummy-ci-key" >> $GITHUB_ENV

      - name: Run unit tests
        run: |
          pytest -q

  e2e-fake:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start coordinator (fake workflow)
        env:
          GOOGLE_API_KEY: dummy-ci-key
          USE_FAKE_WORKFLOW: "1"
        run: |
          python coordinator/main.py &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          # Wait for health
          for i in {1..60}; do
            if curl -sf http://localhost:5000/health >/dev/null; then
              echo "Coordinator healthy"; break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:5000/health >/dev/null; then
            echo "Coordinator did not become healthy"; kill $SERVER_PID; exit 1
          fi
          # Run quick E2E test
          python quick_test.py || (RC=$?; kill $SERVER_PID; exit $RC)
          kill $SERVER_PID
